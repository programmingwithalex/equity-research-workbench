[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-research-workbench"
version = "0.1.0.dev0"
description = "Evidence-grounded company research and filing comparisons"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [{ name = "programmingwithalex" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
    "setuptools==84.2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]
extend-exclude = ["data", "artifacts", "private"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
strict = true
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
